name: Release

# Images are built here rather than on a laptop, so every image can be traced back to a commit.
# Both amd64 and arm64: a Kubernetes cluster is usually the first, but docker compose on an Apple
# Silicon machine or an ARM server needs the second, and the server is plain JavaScript, so arm64
# costs build time under emulation and nothing else.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      # Nothing is pushed that has not passed.
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # The short sha is what a deploy names and a rollback returns to. `latest` only ever
          # means the default branch.
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A version tag also publishes the chart, with chart version == appVersion == the tag, so the
      # chart's default image is the image this same run just pushed. Refuse if the three disagree.
      - name: Check versions agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chart=$(awk '/^version:/{print $2}' deploy/helm/ledger-mcp/Chart.yaml)
          app=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2}' deploy/helm/ledger-mcp/Chart.yaml)
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag chart=$chart appVersion=$app package.json=$pkg"
          [ "$tag" = "$chart" ] && [ "$tag" = "$app" ] && [ "$tag" = "$pkg" ]
      - uses: azure/setup-helm@v4
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Publish the chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/ledger-mcp --destination dist-chart
          helm push dist-chart/ledger-mcp-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "chart: oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/ledger-mcp ${GITHUB_REF_NAME#v}" >> "$GITHUB_STEP_SUMMARY"

      - name: What to deploy
        run: |
          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
