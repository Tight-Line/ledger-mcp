name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm writes the upstream git dependency into the lockfile as git+ssh, and a runner has no
      # SSH key for GitHub. The repository is public, so https needs none.
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      # Includes the checks that upstream still has the shape this server relies on (its tool
      # list, its client's token fields, the attachable path guard), against the pinned commit.
      - run: npm test

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/ledger-mcp -f deploy/helm/ledger-mcp/values-example.yaml --set image.tag=ci
      - run: helm template ci deploy/helm/ledger-mcp -f deploy/helm/ledger-mcp/values-example.yaml --set image.tag=ci > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
