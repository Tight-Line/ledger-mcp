apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ledger-mcp.fullname" . }}-data
  labels:
    {{- include "ledger-mcp.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`, so removing the release does not also discard the connection.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
