{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ledger-mcp.fullname" . }}
  labels:
    {{- include "ledger-mcp.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  # No tls block: this assumes TLS terminates in front of the ingress controller and arrives here
  # as plain HTTP. Add one for a cluster that terminates TLS at the ingress.
  rules:
    - host: {{ include "ledger-mcp.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ledger-mcp.fullname" . }}
                port:
                  name: http
{{- end }}
