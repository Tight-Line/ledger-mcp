{{- $full := include "ledger-mcp.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  labels:
    {{- include "ledger-mcp.labels" . | nindent 4 }}
spec:
  # ONE replica, and Recreate rather than a rolling update. The QuickBooks refresh token lives in
  # a file and Intuit invalidates the old value every time it rotates, so two processes refreshing
  # from the same file race, and the loser holds a dead token. Recreate means the old pod is gone
  # before the new one reads the file.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ledger-mcp.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ledger-mcp.labels" . | nindent 8 }}
      annotations:
        # Roll the pod when the allowlist or any other setting changes, since they are env.
        checksum/settings: {{ include (print $.Template.BasePath "/settings.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-mcp
          image: "{{ .Values.image.repository }}:{{ include "ledger-mcp.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ $full }}
            - secretRef:
                name: {{ .Values.existingSecret }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $full }}-data
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
